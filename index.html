<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All-in-One Student Planner</title>
  <style>
    :root {
      --bg: #0f1220;
      --bg2: #171a2e;
      --card: rgba(255,255,255,0.08);
      --card2: rgba(255,255,255,0.12);
      --text: #f4f6ff;
      --muted: #aeb6d9;
      --line: rgba(255,255,255,0.13);
      --primary: #8b5cf6;
      --primary2: #22d3ee;
      --danger: #fb7185;
      --warning: #fbbf24;
      --success: #34d399;
      --shadow: 0 18px 45px rgba(0,0,0,0.28);
      --radius: 22px;
    }

    [data-theme="light"] {
      --bg: #f4f7fb;
      --bg2: #eaf0ff;
      --card: rgba(255,255,255,0.85);
      --card2: rgba(255,255,255,1);
      --text: #111827;
      --muted: #596174;
      --line: rgba(17,24,39,0.12);
      --shadow: 0 18px 40px rgba(31,41,55,0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139,92,246,0.35), transparent 30%),
        radial-gradient(circle at top right, rgba(34,211,238,0.28), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: var(--text);
      background: var(--card2);
      transition: 0.2s transform, 0.2s background, 0.2s opacity;
    }

    button:hover { transform: translateY(-1px); background: rgba(139,92,246,0.22); }
    button:active { transform: translateY(0); }

    input, select, textarea {
      width: 100%;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 12px;
      outline: none;
    }

    [data-theme="light"] input,
    [data-theme="light"] select,
    [data-theme="light"] textarea {
      background: rgba(255,255,255,0.92);
    }

    textarea { min-height: 92px; resize: vertical; }

    .app {
      display: grid;
      grid-template-columns: 285px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px;
      border-right: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(18px);
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      font-size: 23px;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.03em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 12px 13px;
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .nav button.active {
      color: var(--text);
      background: linear-gradient(135deg, rgba(139,92,246,0.36), rgba(34,211,238,0.18));
      border: 1px solid var(--line);
    }

    .sidebar-card {
      margin-top: 18px;
      padding: 15px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .progress-ring {
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-ring span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      border-radius: inherit;
      width: 0%;
    }

    .main {
      padding: 28px;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .title-block h2 {
      margin: 0;
      font-size: clamp(26px, 3vw, 44px);
      letter-spacing: -0.05em;
    }

    .title-block p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), #6d5dfc) !important;
      color: white;
      box-shadow: 0 10px 30px rgba(139,92,246,0.26);
    }

    .danger { background: rgba(251,113,133,0.16) !important; color: var(--danger); }
    .success { background: rgba(52,211,153,0.15) !important; color: var(--success); }
    .warning { background: rgba(251,191,36,0.15) !important; color: var(--warning); }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .metric {
      min-height: 122px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric .num {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
    }

    .section { display: none; animation: fade 0.22s ease; }
    .section.active { display: block; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      display: grid;
      gap: 9px;
      padding: 13px;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .item-title {
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .item-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.07);
      color: var(--muted);
      font-size: 12px;
    }

    .tiny-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tiny-actions button {
      padding: 7px 9px;
      border-radius: 11px;
      font-size: 12px;
    }

    .done {
      opacity: 0.58;
    }

    .done .item-title {
      text-decoration: line-through;
    }

    .calendar-shell {
      display: grid;
      gap: 14px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap: 8px;
    }

    .weekday {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 6px;
    }

    .day {
      min-height: 112px;
      padding: 9px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.055);
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
    }

    .day.today {
      outline: 2px solid rgba(34,211,238,0.75);
      background: rgba(34,211,238,0.10);
    }

    .day.muted { opacity: 0.38; }
    .day-num { font-weight: 750; font-size: 13px; }

    .event-dot {
      border-radius: 10px;
      padding: 4px 6px;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      background: rgba(139,92,246,0.22);
      border: 1px solid rgba(139,92,246,0.27);
    }

    .event-dot.exam { background: rgba(251,113,133,0.20); border-color: rgba(251,113,133,0.30); }
    .event-dot.todo { background: rgba(52,211,153,0.16); border-color: rgba(52,211,153,0.28); }
    .event-dot.quran { background: rgba(34,211,238,0.16); border-color: rgba(34,211,238,0.28); }
    .event-dot.gym { background: rgba(251,191,36,0.16); border-color: rgba(251,191,36,0.28); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(780px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(135deg, rgba(28,31,54,0.98), rgba(17,20,34,0.98));
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.45);
    }

    [data-theme="light"] .modal {
      background: rgba(255,255,255,0.98);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-head h3 { margin: 0; font-size: 24px; }

    .close {
      width: 38px;
      height: 38px;
      border-radius: 14px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 8px;
    }

    .timer-box {
      text-align: center;
      padding: 12px 8px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--line);
    }

    .timer-box strong {
      display: block;
      font-size: 22px;
    }

    .timer-box span {
      color: var(--muted);
      font-size: 11px;
    }

    .course-card {
      display: grid;
      gap: 12px;
    }

    .grade-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .bar {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table th, .table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .table th { color: var(--muted); font-size: 12px; }

    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
    }

    .split {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      border-radius: 999px;
      padding: 15px 19px;
      box-shadow: var(--shadow);
    }

    .searchbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .mini-planner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .habit-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap: 7px;
    }

    .habit-day {
      min-height: 64px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      padding: 7px;
      display: grid;
      gap: 5px;
    }

    .habit-day button {
      padding: 6px;
      border-radius: 10px;
      font-size: 12px;
    }

    .checked {
      background: rgba(52,211,153,0.22) !important;
      color: var(--success);
    }

    .print-only { display: none; }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .nav { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid-4, .grid-3, .grid-2, .split, .mini-planner { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .main { padding: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .calendar-grid { gap: 5px; }
      .day { min-height: 88px; padding: 7px; }
      .event-dot { display: none; }
      .timer-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .nav { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: white; color: black; }
      .sidebar, .top-actions, .fab, .modal-backdrop { display: none !important; }
      .app { display: block; }
      .main { max-width: none; }
      .card { box-shadow: none; border: 1px solid #ddd; background: white; }
      .print-only { display: block; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>Student Command Center</h1>
          <p>Calendar • Grades • Quran • Gym • Focus</p>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-card">
        <strong>Today completion</strong>
        <div class="progress-ring"><span id="todayProgress"></span></div>
        <p class="note" id="todayProgressText">0% done</p>
      </div>

      <div class="sidebar-card">
        <strong>Fast tips</strong>
        <p class="note">Add exams and deadlines first. Then connect todos to courses so your dashboard becomes useful automatically.</p>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title-block">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Your full study, life, and deadline planner.</p>
        </div>
        <div class="top-actions">
          <button class="pill-btn" onclick="toggleTheme()">🌓 Theme</button>
          <button class="pill-btn" onclick="exportData()">⬇ Export</button>
          <button class="pill-btn" onclick="document.getElementById('importFile').click()">⬆ Import</button>
          <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)" />
          <button class="pill-btn primary" onclick="openQuickAdd()">＋ Quick Add</button>
        </div>
      </div>

      <section class="section active" id="dashboard"></section>
      <section class="section" id="calendar"></section>
      <section class="section" id="tasks"></section>
      <section class="section" id="courses"></section>
      <section class="section" id="exams"></section>
      <section class="section" id="quran"></section>
      <section class="section" id="gym"></section>
      <section class="section" id="planner"></section>
      <section class="section" id="settings"></section>
    </main>
  </div>

  <button class="fab primary" onclick="openQuickAdd()">＋ Add</button>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Add item</h3>
        <button class="close" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const DEFAULT_STATE = {
      theme: "dark",
      activePage: "dashboard",
      calendarMonth: new Date().getMonth(),
      calendarYear: new Date().getFullYear(),
      tasks: [],
      courses: [],
      exams: [],
      quran: [],
      gym: [],
      planner: {},
      settings: {
        name: "Mohamed",
        weekStart: "Sunday",
        targetStudyHours: 25,
        quranWeeklyTarget: 5,
        gymWeeklyTarget: 4
      }
    };

    const NAV = [
      ["dashboard", "🏠", "Dashboard"],
      ["calendar", "📅", "Calendar"],
      ["tasks", "✅", "Tasks"],
      ["courses", "🎓", "Courses & Grades"],
      ["exams", "⏳", "Final Exams"],
      ["quran", "📖", "Quran"],
      ["gym", "🏋️", "Gym"],
      ["planner", "🗓️", "Today/Tomorrow"],
      ["settings", "⚙️", "Settings"]
    ];

    let state = loadState();
    let timerInterval = null;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem("studentCommandCenter"));
        return saved ? deepMerge(structuredClone(DEFAULT_STATE), saved) : structuredClone(DEFAULT_STATE);
      } catch {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      localStorage.setItem("studentCommandCenter", JSON.stringify(state));
      document.documentElement.dataset.theme = state.theme;
      render();
    }

    function deepMerge(target, src) {
      for (const key in src) {
        if (src[key] && typeof src[key] === "object" && !Array.isArray(src[key])) {
          target[key] = deepMerge(target[key] || {}, src[key]);
        } else {
          target[key] = src[key];
        }
      }
      return target;
    }

    function $(id) { return document.getElementById(id); }

    function todayISO(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().slice(0,10);
    }

    function dateTimeLocalValue(date = new Date()) {
      const d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0,16);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "No date";
      return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
    }

    function formatDateTime(dt) {
      if (!dt) return "No time";
      return new Date(dt).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    }

    function daysBetween(dateStr) {
      const target = new Date(dateStr);
      const now = new Date();
      return Math.ceil((target - now) / (1000*60*60*24));
    }

    function escapeHtml(s = "") {
      return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function setPage(page) {
      state.activePage = page;
      saveState();
    }

    function renderNav() {
      $("nav").innerHTML = NAV.map(([id, icon, label]) => `
        <button class="${state.activePage === id ? "active" : ""}" onclick="setPage('${id}')">
          <span>${icon} ${label}</span>
          <span>${navCount(id)}</span>
        </button>
      `).join("");
    }

    function navCount(id) {
      if (id === "tasks") return state.tasks.filter(t => !t.done).length;
      if (id === "courses") return state.courses.length;
      if (id === "exams") return state.exams.length;
      if (id === "quran") return state.quran.length;
      if (id === "gym") return state.gym.length;
      return "";
    }

    function render() {
      document.documentElement.dataset.theme = state.theme;
      renderNav();
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      $(state.activePage).classList.add("active");

      const navItem = NAV.find(n => n[0] === state.activePage);
      $("pageTitle").textContent = navItem ? navItem[2] : "Dashboard";
      $("pageSubtitle").textContent = subtitles[state.activePage] || "Your planner.";

      renderDashboard();
      renderCalendar();
      renderTasks();
      renderCourses();
      renderExams();
      renderQuran();
      renderGym();
      renderPlanner();
      renderSettings();
      updateTodayProgress();
      startTimers();
    }

    const subtitles = {
      dashboard: "A connected overview of deadlines, tasks, exams, habits, and grades.",
      calendar: "Every task, final, Quran session, gym session, and deadline in one place.",
      tasks: "Study tasks with lecture numbers, modes, resources, priorities, and course links.",
      courses: "Track weighted grades, assignment groups, best-of rules, averages, and finals.",
      exams: "Countdowns and preparation status for final exams.",
      quran: "Weekly Quran memorization and revision tracker.",
      gym: "Workout schedule, streaks, and weekly training tracker.",
      planner: "Plan today and tomorrow without losing the bigger picture.",
      settings: "Personalize, backup, reset, and manage your data."
    };

    function allEvents() {
      const ev = [];
      state.tasks.forEach(t => {
        if (t.dueDate) ev.push({date: t.dueDate.slice(0,10), title: t.title, type: "todo", id: t.id});
      });
      state.exams.forEach(e => {
        if (e.dateTime) ev.push({date: e.dateTime.slice(0,10), title: e.title, type: "exam", id: e.id});
      });

    function courseGrade(course) {
      let earnedPercent = 0;
      let plannedWeight = 0;
      (course.groups || []).forEach(g => {
        const weight = Number(g.weight || 0);
        plannedWeight += weight;
        const items = (g.items || []).filter(i => i.score !== "" && i.score != null && i.max !== "" && i.max != null);
        let groupScore = 0;
        if (items.length) {
          const ratios = items.map(i => Number(i.score || 0) / Math.max(1, Number(i.max || 100)) * 100);
          if (g.method === "bestN") {
            const n = Math.max(1, Number(g.bestN || 1));
            const best = ratios.sort((a,b)=>b-a).slice(0,n);
            groupScore = best.reduce((a,b)=>a+b,0) / best.length;
          } else if (g.method === "sum") {
            const scored = items.reduce((s,i)=>s+Number(i.score||0),0);
            const maxed = items.reduce((s,i)=>s+Number(i.max||100),0);
            groupScore = scored / Math.max(1,maxed) * 100;
          } else {
            groupScore = ratios.reduce((a,b)=>a+b,0) / ratios.length;
          }
        }
        earnedPercent += groupScore * weight / 100;
      });
      return {earnedPercent: Math.round(earnedPercent*100)/100, plannedWeight};
    }

        <form onsubmit="saveExam(event, '${id || ""}')">
          <div class="form-grid">
            <label>Title<input name="title" required value="${escapeHtml(e.title || "")}" placeholder="CSCI322 Final" /></label>
            <label>Course<select name="courseId">${courseOptions}</select></label>
            <label>Date/time<input type="datetime-local" name="dateTime" required value="${e.dateTime ? dateTimeLocalValue(e.dateTime) : (date ? date + "T09:00" : "")}" /></label>
            <label>Expected weight %<input type="number" name="weight" value="${escapeHtml(e.weight || "")}" placeholder="40" /></label>
            <label class="full">Scope/topics<textarea name="scope" placeholder="Lectures 1-10, chapters, topics...">${escapeHtml(e.scope || "")}</textarea></label>
            <label class="full">Strategy<textarea name="strategy" placeholder="Plan: revise slides, solve past exams, generate questions...">${escapeHtml(e.strategy || "")}</textarea></label>
          </div>
          <button class="primary" type="submit">Save exam</button>
        </form>
      `);
    }

    function saveExam(e, id) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      if (id) state.exams = state.exams.map(x => x.id===id ? {...x, ...data} : x);
      else state.exams.push({id:uid(), ...data});
      closeModal();
      saveState();
    }

    function createExamPrepTasks(examId) {
      const e = state.exams.find(x=>x.id===examId);
      const examDate = new Date(e.dateTime);
      const templates = [
        ["Collect all material", "Admin", 10],
        ["Revise lectures from scratch", "From scratch", 7],
        ["Create summary sheet", "Summarize", 5],
        ["Generate questions", "Generate questions", 4],
        ["Solve past exams", "Past exams", 3],
        ["Final quick review", "Quick review", 1]
      ];
      templates.forEach(([title, mode, daysBefore]) => {
        const d = new Date(examDate);
        d.setDate(d.getDate() - daysBefore);
        d.setHours(18,0,0,0);
        state.tasks.push({
          id: uid(),
          title: `${e.title}: ${title}`,
          courseId: e.courseId,
          dueDate: dateTimeLocalValue(d),
          type: "Final prep",
          mode,
          priority: daysBefore <= 3 ? "Urgent" : "High",
          estimatedMins: 90,
          status: "Not started",
          done: false,
          notes: e.scope || ""
        });
      });
      saveState();
    }

    function renderQuran() {
      const week = itemsThisWeek(state.quran, "date");
      $("quran").innerHTML = `
        <div class="top-actions" style="margin-bottom:14px;">
          <button class="primary" onclick="openQuranForm()">＋ Add Quran session</button>
        </div>
        <div class="grid grid-3">
          ${metric("📖", "This week", week.length, `Target ${state.settings.quranWeeklyTarget || 5}`)}
          ${metric("✅", "Completed", state.quran.filter(q=>q.done).length, "All time")}
          ${metric("🔁", "Revision sessions", state.quran.filter(q=>q.type==="Revision").length, "All time")}
        </div>
        <div class="card" style="margin-top:18px;">
          <h3>Weekly Quran tracker</h3>
          ${weekStrip("quran")}
        </div>
        <div class="card" style="margin-top:18px;">
          <h3>Quran log</h3>
          <div class="list">${state.quran.length ? state.quran.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(quranCard).join("") : empty("No Quran sessions yet.")}</div>
        </div>
      `;
    }

    function quranCard(q) {
      return `
        <div class="item ${q.done ? "done" : ""}">
          <div class="item-head">
            <div>
              <div class="item-title">${escapeHtml(q.surah || "Quran session")}</div>
              <div class="item-meta">
                <span class="tag">${q.type || "Memorization"}</span>
                <span class="tag">${formatDate(q.date)}</span>
                ${q.ayat ? `<span class="tag">Ayat: ${escapeHtml(q.ayat)}</span>` : ""}
              </div>
            </div>
            <div class="tiny-actions">
              <button class="${q.done ? "warning" : "success"}" onclick="toggleDone('quran','${q.id}')">${q.done ? "Undo" : "Done"}</button>
              <button onclick="openQuranForm('${q.id}')">Edit</button>
              <button class="danger" onclick="deleteItem('quran','${q.id}')">Delete</button>
            </div>
          </div>
          ${q.notes ? `<p class="note">${escapeHtml(q.notes)}</p>` : ""}
        </div>
      `;
    }

    function openQuranForm(id=null, date=null) {
      const q = id ? state.quran.find(x=>x.id===id) : {};
      openModal(id ? "Edit Quran session" : "Add Quran session", `
        <form onsubmit="saveQuran(event, '${id || ""}')">
          <div class="form-grid">
            <label>Date<input type="date" name="date" required value="${q.date || date || todayISO()}" /></label>
            <label>Type<select name="type">${["Memorization","Revision","Listening","Tafsir","Recitation"].map(v=>`<option ${q.type===v?"selected":""}>${v}</option>`).join("")}</select></label>
            <label>Surah<input name="surah" value="${escapeHtml(q.surah || "")}" placeholder="Al-Baqarah" /></label>
            <label>Ayat/pages<input name="ayat" value="${escapeHtml(q.ayat || "")}" placeholder="1-10 / page 2" /></label>
            <label class="full">Notes<textarea name="notes">${escapeHtml(q.notes || "")}</textarea></label>
          </div>
          <button class="primary" type="submit">Save Quran session</button>
        </form>
      `);
    }

    function saveQuran(e, id) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      if (id) state.quran = state.quran.map(x => x.id===id ? {...x, ...data} : x);
      else state.quran.push({id:uid(), done:false, ...data});
      closeModal();
      saveState();
    }

    function renderGym() {
      const week = itemsThisWeek(state.gym, "date");
      $("gym").innerHTML = `
        <div class="top-actions" style="margin-bottom:14px;">
          <button class="primary" onclick="openGymForm()">＋ Add workout</button>
        </div>
        <div class="grid grid-3">
          ${metric("🏋️", "This week", week.length, `Target ${state.settings.gymWeeklyTarget || 4}`)}
          ${metric("✅", "Completed", state.gym.filter(g=>g.done).length, "All time")}
          ${metric("💪", "Strength days", state.gym.filter(g=>g.type==="Strength").length, "All time")}
        </div>
        <div class="card" style="margin-top:18px;">
          <h3>Weekly gym tracker</h3>
          ${weekStrip("gym")}
        </div>
        <div class="card" style="margin-top:18px;">
          <h3>Workout log</h3>
          <div class="list">${state.gym.length ? state.gym.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(gymCard).join("") : empty("No workouts yet.")}</div>
        </div>
      `;
    }

    function gymCard(g) {
      return `
        <div class="item ${g.done ? "done" : ""}">
          <div class="item-head">
            <div>
              <div class="item-title">${escapeHtml(g.title || "Workout")}</div>
              <div class="item-meta">
                <span class="tag">${g.type || "Workout"}</span>
                <span class="tag">${formatDate(g.date)}</span>
                ${g.duration ? `<span class="tag">${escapeHtml(g.duration)} min</span>` : ""}
              </div>
            </div>
            <div class="tiny-actions">
              <button class="${g.done ? "warning" : "success"}" onclick="toggleDone('gym','${g.id}')">${g.done ? "Undo" : "Done"}</button>
              <button onclick="openGymForm('${g.id}')">Edit</button>
              <button class="danger" onclick="deleteItem('gym','${g.id}')">Delete</button>
            </div>
          </div>
          ${g.notes ? `<p class="note">${escapeHtml(g.notes)}</p>` : ""}
        </div>
      `;
    }

    function openGymForm(id=null, date=null) {
      const g = id ? state.gym.find(x=>x.id===id) : {};
      openModal(id ? "Edit workout" : "Add workout", `
        <form onsubmit="saveGym(event, '${id || ""}')">
          <div class="form-grid">
            <label>Date<input type="date" name="date" required value="${g.date || date || todayISO()}" /></label>
            <label>Type<select name="type">${["Strength","Cardio","Push","Pull","Legs","Full body","Mobility","Rest/Recovery"].map(v=>`<option ${g.type===v?"selected":""}>${v}</option>`).join("")}</select></label>
            <label>Title<input name="title" value="${escapeHtml(g.title || "")}" placeholder="Push day / Legs / Cardio" /></label>
            <label>Duration minutes<input type="number" name="duration" value="${escapeHtml(g.duration || "")}" /></label>
            <label class="full">Plan / exercises<textarea name="notes">${escapeHtml(g.notes || "")}</textarea></label>
          </div>
          <button class="primary" type="submit">Save workout</button>
        </form>
      `);
    }

    function saveGym(e, id) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      if (id) state.gym = state.gym.map(x => x.id===id ? {...x, ...data} : x);
      else state.gym.push({id:uid(), done:false, ...data});
      closeModal();
      saveState();
    }

    function itemsThisWeek(arr, key) {
      const now = new Date();
      const start = new Date(now);
      start.setDate(now.getDate() - now.getDay());
      start.setHours(0,0,0,0);
      const end = new Date(start);
      end.setDate(start.getDate()+7);
      return arr.filter(x => {
        if (!x[key]) return false;
        const d = new Date(x[key] + "T00:00:00");
        return d >= start && d < end;
      });
    }

    function weekDates() {
      const now = new Date();
      const start = new Date(now);
      start.setDate(now.getDate() - now.getDay());
      return Array.from({length:7}, (_,i) => {
        const d = new Date(start);
        d.setDate(start.getDate()+i);
        return d;
      });
    }

    function weekStrip(type) {
      const arr = type === "quran" ? state.quran : state.gym;
      return `<div class="habit-grid">${weekDates().map(d => {
        const iso = d.toISOString().slice(0,10);
        const dayItems = arr.filter(x => x.date === iso);
        return `<div class="habit-day">
          <strong>${d.toLocaleDateString(undefined,{weekday:"short"})}</strong>
          <span class="note">${d.getDate()}</span>
          <button class="${dayItems.some(x=>x.done) ? "checked" : ""}" onclick="${type === "quran" ? `openQuranForm(null,'${iso}')` : `openGymForm(null,'${iso}')`}">${dayItems.length ? dayItems.length + " item(s)" : "Add"}</button>
        </div>`;
      }).join("")}</div>`;
    }

    function renderPlanner() {
      $("planner").innerHTML = `
        <div class="mini-planner">
          ${dailyPlannerCard(todayISO(), "Today")}
          ${dailyPlannerCard(todayISO(1), "Tomorrow")}
        </div>
      `;
    }

    function dailyPlannerCard(date, label) {
      const tasks = state.tasks.filter(t => t.dueDate && t.dueDate.slice(0,10) === date);
      const exams = state.exams.filter(e => e.dateTime && e.dateTime.slice(0,10) === date);
      const quran = state.quran.filter(q => q.date === date);
      const gym = state.gym.filter(g => g.date === date);
      const notes = state.planner[date] || "";
      return `
        <div class="card">
          <div class="item-head">
            <div>
              <h3>${label}</h3>
              <p class="note">${formatDate(date)}</p>
            </div>
            <button onclick="openTaskForm(null,'${date}')">＋ Task</button>
          </div>
          <div class="list" style="margin:12px 0;">
            ${[...tasks.map(taskCard), ...exams.map(examTimerCard), ...quran.map(quranCard), ...gym.map(gymCard)].join("") || empty("No scheduled items.")}
          </div>
          <label>Planner notes
            <textarea oninput="savePlannerNote('${date}', this.value)" placeholder="Top 3 priorities, schedule blocks, reminders...">${escapeHtml(notes)}</textarea>
          </label>
        </div>
      `;
    }

    function savePlannerNote(date, value) {
      state.planner[date] = value;
      localStorage.setItem("studentCommandCenter", JSON.stringify(state));
    }

    function renderSettings() {
      $("settings").innerHTML = `
        <div class="card">
          <h3>Settings</h3>
          <form onsubmit="saveSettings(event)">
            <div class="form-grid">
              <label>Name<input name="name" value="${escapeHtml(state.settings.name || "")}" /></label>
              <label>Target study hours/week<input type="number" name="targetStudyHours" value="${escapeHtml(state.settings.targetStudyHours || 25)}" /></label>
              <label>Quran weekly target<input type="number" name="quranWeeklyTarget" value="${escapeHtml(state.settings.quranWeeklyTarget || 5)}" /></label>
              <label>Gym weekly target<input type="number" name="gymWeeklyTarget" value="${escapeHtml(state.settings.gymWeeklyTarget || 4)}" /></label>
            </div>
            <div style="height:14px"></div>
            <button class="primary" type="submit">Save settings</button>
          </form>
        </div>

        <div class="card" style="margin-top:18px;">
          <h3>Data safety</h3>
          <p class="note">Your data is saved in this browser using localStorage. Use Export before clearing browser data or moving laptops.</p>
          <div class="top-actions">
            <button onclick="exportData()">Export backup</button>
            <button onclick="window.print()">Print summary</button>
            <button class="danger" onclick="resetAll()">Reset everything</button>
          </div>
        </div>
      `;
    }

    function saveSettings(e) {
      e.preventDefault();
      state.settings = {...state.settings, ...Object.fromEntries(new FormData(e.target).entries())};
      saveState();
    }

    function updateTodayProgress() {
      const todays = state.tasks.filter(t => t.dueDate && t.dueDate.slice(0,10) === todayISO());
      const done = todays.filter(t => t.done).length;
      const pct = todays.length ? Math.round(done / todays.length * 100) : 0;
      $("todayProgress").style.width = pct + "%";
      $("todayProgressText").textContent = `${pct}% done • ${done}/${todays.length} tasks`;
    }

    function openQuickAdd() {
      openModal("Quick add", `
        <div class="grid grid-2">
          <button class="primary" onclick="openTaskForm()">✅ Task / study lecture</button>
          <button onclick="openCourseForm()">🎓 Course</button>
          <button onclick="openExamForm()">⏳ Final exam</button>
          <button onclick="openQuranForm()">📖 Quran session</button>
          <button onclick="openGymForm()">🏋️ Gym workout</button>
          <button onclick="setPage('planner'); closeModal()">🗓️ Today/Tomorrow planner</button>
        </div>
      `);
    }

    function openModal(title, body) {
      $("modalTitle").textContent = title;
      $("modalBody").innerHTML = body;
      $("modalBackdrop").classList.add("show");
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("show");
    }

    $("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    function deleteItem(collection, id) {
      if (!confirm("Delete this item?")) return;
      state[collection] = state[collection].filter(x => x.id !== id);
      saveState();
    }

    function toggleDone(collection, id) {
      state[collection] = state[collection].map(x => x.id===id ? {...x, done: !x.done} : x);
      saveState();
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      saveState();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `student-command-center-backup-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          state = deepMerge(structuredClone(DEFAULT_STATE), imported);
          saveState();
          alert("Imported successfully.");
        } catch {
          alert("Invalid backup file.");
        }
      };
      reader.readAsText(file);
    }

    function resetAll() {
      if (!confirm("This will delete all local planner data. Continue?")) return;
      state = structuredClone(DEFAULT_STATE);
      localStorage.removeItem("studentCommandCenter");
      saveState();
    }

    function empty(text) {
      return `<div class="empty">${text}</div>`;
    }

    render();
  </script>
</body>
</html>
